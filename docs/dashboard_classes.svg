<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1240" viewBox="0 0 1360 1240" role="img" aria-labelledby="title desc">
<title id="title">Group 21 dashboard UML class diagram</title>
<desc id="desc">EnergyDashboard aggregates one DashboardData and one EnergyChart. All three classes have constructors, setup methods, and getters and setters.</desc>
<rect width="1360" height="1240" fill="white"/>
<text x="40" y="35" font-family="Arial" font-size="25" fill="#142239">Group 21 · Moiz Zaheer Malik · Dashboard classes</text>
